onboarding = false
[ui]
show_agent_labels_on_pane_borders = true

[ui.sidebar.agents]
rows = [
    ["state_icon", { token = "$harness_logo", bold = true }, "agent"],
    ["workspace", "tab"],
]

[keys]
prefix = "§"
workspace_picker = "prefix+w"
previous_workspace = "prefix+["
next_workspace = "prefix+]"

[[keys.command]]
key = "prefix+u"
type = "pane"
command = "herdr_worktree_flow.sh"

[[keys.command]]
key = "prefix+shift+u"
type = "pane"
command = "herdr_worktree_close.sh"

[theme]
name = "tokyo-night"
auto_switch = false
